[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plotter"
version = "0.1.0"
description = "Plotly-based plotting utilities for waveforms, spectral analyses, and general-purpose figures."
requires-python = ">=3.11"
dependencies = ["plotly>=5", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "fig4_composite.py"

[tool.ruff]
line-length = 88
target-version = "py311"
# fig4_composite.py is a standalone script (not part of the `plotter`
# package) with an intentional sys.path hack before its local imports.
extend-exclude = ["fig4_composite.py"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort (import sorting), UP: pyupgrade,
# B: flake8-bugbear (catches common bugs like mutable defaults)
select = ["E", "W", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["plotter"]
